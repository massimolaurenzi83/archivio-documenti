# Compila l'app e la pubblica su GitHub Pages.
#
# Prerequisito, da fare una volta sola: Settings -> Pages -> Source: GitHub Actions.
name: Deploy su GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un deploy alla volta; le esecuzioni in coda vengono sostituite dalla piu recente.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Verifica dei tipi
        run: npm run typecheck

      - name: Build
        # Su Pages il sito vive in /<nome-repo>/, quindi la base di Vite deve
        # corrispondere: la ricaviamo dal nome del repository.
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      # `enablement: true` fa attivare Pages all'azione stessa, tramite API.
      # Senza, il primo deploy fallisce con "Get Pages site failed: Not Found"
      # finche' qualcuno non imposta a mano Settings -> Pages -> GitHub Actions:
      # un passo invisibile che chiunque cloni il repository sbatterebbe contro.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
